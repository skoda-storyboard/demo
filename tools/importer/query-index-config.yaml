# SKODA-401 — query-index schema + selectors (per-locale index definitions).
#
# In-repo source-of-truth copy ONLY. The platform does NOT read this file:
# on the config service the index config is submitted via
#   PUT https://admin.hlx.page/config/skoda-storyboard/sites/demo/content/query.yaml
# (Content-Type: text/yaml). Push it with ./push-query-config.sh.
# helix-query.yaml / fstab.yaml / paths.json are retired for this project.
#
# Column schema (SKODA-401): base columns + the 15 taxonomy facets + tags.
# (path + lastModified are emitted automatically by the indexer.)
#
# SELECTOR RULE (doc-confirmed 2026-09-22, aem.live /docs/special-metadata-properties):
#   `tags` is a RESERVED special metadata property → rendered as
#   <meta property="article:tag"> (one meta per tag, comma/bullet split), so it
#   is selected via property="article:tag" and joined multi-value.
#   The other 14 facets are NOT special metadata keys → the importer emits them
#   as plain <meta name="<facet>">, so they are selected via name="<facet>".
#   (Verified live on /en/skoda-model/elroq: name=model/template/publisheddate,
#    property=article:tag.) Do NOT assume the non-tag facets map to property=.
#
# The importer-side normalization that POPULATES these fields where the source
# markup lacks clean meta (category-from-URL, 4-way date fallback, per-facet
# extraction) lives in tools/importer/transformers/skoda-metadata.js (SKODA-401).

version: 1

indices:
  en: &default
    include:
      - /en/**
    exclude:
      - /en/drafts/**
      - /en/fragments/**
      - /en/**/modals/**
      - /en/nav
      - /en/footer
    target: /en/query-index.json
    properties:
      # --- base columns ---
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="publisheddate"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      # --- tags: reserved special prop → article:tag (multi-value, comma-joined) ---
      tags:
        select: head > meta[property="article:tag"]
        values:
          - attribute(el, "content")
      # --- the 15 taxonomy facets (custom meta names emitted by the importer) ---
      # NOTE the tags-vs-facets asymmetry (do NOT "fix" it to match):
      #  - `tags` is a RESERVED prop → AEM SPLITS the comma-separated row into N
      #    separate <meta property="article:tag"> tags, so it needs `values:` (array).
      #  - the 14 facets below are PLAIN name= metas → AEM does NOT split them; the
      #    importer emits ONE comma-joined <meta name="<facet>"> per facet, so a
      #    single `value:` string is correct (already comma-joined for includes()).
      model:
        select: head > meta[name="model"]
        value: attribute(el, "content")
      bodywork:
        select: head > meta[name="bodywork"]
        value: attribute(el, "content")
      derivative:
        select: head > meta[name="derivative"]
        value: attribute(el, "content")
      motorsport:
        select: head > meta[name="motorsport"]
        value: attribute(el, "content")
      equipment:
        select: head > meta[name="equipment"]
        value: attribute(el, "content")
      technology:
        select: head > meta[name="technology"]
        value: attribute(el, "content")
      years:
        select: head > meta[name="years"]
        value: attribute(el, "content")
      view:
        select: head > meta[name="view"]
        value: attribute(el, "content")
      company:
        select: head > meta[name="company"]
        value: attribute(el, "content")
      concept:
        select: head > meta[name="concept"]
        value: attribute(el, "content")
      environment:
        select: head > meta[name="environment"]
        value: attribute(el, "content")
      happening:
        select: head > meta[name="happening"]
        value: attribute(el, "content")
      history:
        select: head > meta[name="history"]
        value: attribute(el, "content")
      sponsorship:
        select: head > meta[name="sponsorship"]
        value: attribute(el, "content")
      vip:
        select: head > meta[name="vip"]
        value: attribute(el, "content")

  # --- Stubbed locales (E10 rollout, SKODA-1001). Inherit properties + exclude
  #     from &default via merge; override include + target. Produce empty
  #     indices until /<locale>/ content is published. ---
  de:
    <<: *default
    include:
      - /de/**
    target: /de/query-index.json
  cs:
    <<: *default
    include:
      - /cs/**
    target: /cs/query-index.json
  sk:
    <<: *default
    include:
      - /sk/**
    target: /sk/query-index.json
  sr:
    <<: *default
    include:
      - /sr/**
    target: /sr/query-index.json
  sl:
    <<: *default
    include:
      - /sl/**
    target: /sl/query-index.json
