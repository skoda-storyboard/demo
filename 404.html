<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <!-- the branded 404 (SKODA-706): templates/error-404 loads one of the source's variants from
       /en/fragments/404/; the message below stays if that fragment can't load -->
  <meta name="template" content="error-404">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <!-- brand.css holds the colour primitives + semantic tokens that styles.css consumes (same order as head.html) -->
  <link rel="stylesheet" href="/styles/brand.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main>
    <div>
      <h1>Page not found</h1>
      <p>Or return to the <a href="/">homepage</a>.</p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
