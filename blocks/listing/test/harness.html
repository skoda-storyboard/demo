<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing block harness (SKODA-402)</title>
  <link rel="stylesheet" href="/styles/brand.css">
  <link rel="stylesheet" href="/blocks/listing/listing.css">
  <style>body { font-family: system-ui, sans-serif; margin: 24px; } main { max-width: 1248px; margin: auto; }</style>
</head>
<body>
  <main>
    <!-- A Listing block authored as a DA config table: first cell = block name. -->
    <div class="listing block" data-block-name="listing">
      <div><div>index</div><div>/blocks/listing/test/query-index.json</div></div>
      <div><div>template</div><div>press_release</div></div>
      <div><div>facets</div><div>model, years, bodywork</div></div>
      <div><div>perpage</div><div>3</div></div>
      <div><div>columns</div><div>3</div></div>
    </div>
  </main>
  <script type="module">
    import decorate from '/blocks/listing/listing.js';
    const block = document.querySelector('.listing');
    await decorate(block);
    window.__listingReady = true;
  </script>
</body>
</html>
